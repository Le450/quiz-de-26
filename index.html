function pool(m){const seen=new Set(),r=[];MAT[m].forEach(k=>D[k].Q.forEach((q,j)=>{const key=q[0]+q[1].join("|");if(seen.has(key))return;seen.add(key);const t=D[k].tf,tf=typeof t=="function"?t(j):j<t;r.push([q[0],q[1],q[2],q[3],q[4],tf])}));return r}
function qz(){a.innerHTML=`<div class="hero"><div class="tag">🎲 Quiz personnalisé</div><h1>Ton quiz sur mesure</h1><div>Les questions sont tirées au hasard dans tous les sujets disponibles, toutes antennes confondues.</div></div><div class="sec">Matière</div><div class="grid">`+Object.keys(MAT).map(m=>`<button class="tile ${qm==m?"on":""}" onclick="qm='${m}';qz()"><span class="e">${em(m)}</span><b>${m}</b><small>${pool(m).length} questions</small></button>`).join("")+`</div><div class="sec" style="margin-top:12px">Nombre de questions</div><div class="grid">`+[10,20,30,50].map(n=>`<button class="tile ${qn==n?"on":""}" onclick="qn=${n};qz()"><b>${n}</b></button>`).join("")+`</div><p><button class="b" onclick="sq()" ${qm?"":"disabled"}>Commencer</button><button class="b g" onclick="menu()">← Retour</button></p>`}
function sq(){const p=pool(qm);for(let j=p.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[p[j],p[r]]=[p[r],p[j]]}Qs=p.slice(0,Math.min(qn,p.length));TF=0;ttl="Quiz · "+qm;i=0;s=0;W=[];again=sq;show()}

function oa(y){a.innerHTML=`<div class="hero"><div class="tag">📅 D.E ${y}</div><h1>Choisis l'antenne</h1></div><div class="grid">`+Object.keys(AN[y]).map(k=>`<button class="tile" onclick="om('${y}','${k}')"><span class="e">🏥</span><b>${k}</b><small>${AN[y][k].length} matière(s)</small></button>`).join("")+`</div><p><button class="b g" onclick="oy()">← Retour</button></p>`}
function om(y,k){a.innerHTML=`<div class="hero"><div class="tag">🏥 ${k} · ${y}</div><h1>Choisis la matière</h1></div><div class="list">`+AN[y][k].map(x=>`<button class="tile row" onclick="go('${x[1]}','${y} – ${k} – ${x[0]}')"><span class="e">${em(x[0])}</span><span><b>${x[0]}</b><small>${D[x[1]].Q.length} questions</small></span></button>`).join("")+`</div><p><button class="b g" onclick="oa('${y}')">← Retour</button></p>`}

function end(){
 a.innerHTML=H(ttl)+`<div class="card" style="text-align:center"><div>Ton score</div><div class="big">${s} / ${Qs.length}</div><p>Soit ${(s/Qs.length*20).toFixed(1)} / 20</p><p class="sub">Corrigé établi par Claude : à vérifier avec ton enseignant.</p><button class="b" onclick="again()">Recommencer</button>${W.length?`<button class="b" onclick="rev()">Revoir mes erreurs (${W.length})</button>`:""}<button class="b g" onclick="menu()">Menu</button></div>`;
}
/* ---- Ma progression : enregistrée sur l'appareil (localStorage), sans toucher au moteur ---- */
const PK="monde_progress_v1";
let PG={};try{PG=JSON.parse(localStorage.getItem(PK)||"{}")||{}}catch(e){PG={}}
function pgSave(){try{localStorage.setItem(PK,JSON.stringify(PG))}catch(e){}}
const pgF=x=>(Math.round(x*10)/10).toFixed(1).replace(".",",");
function pgAll(){const k=new Set();Object.values(M).forEach(l=>l.forEach(x=>x[1]&&D[x[1]]&&k.add(x[1])));Object.values(AN).forEach(y=>Object.values(y).forEach(l=>l.forEach(x=>D[x[1]]&&k.add(x[1]))));return[...k]}

function pgBadge(b,t){const sm=b.querySelector("small");if(sm)sm.insertAdjacentHTML("afterend",`<small class="pg">${t}</small>`)}
function pgGroup(b,keys){const d=keys.filter(k=>PG[k]).length;if(d)pgBadge(b,`✅ ${d} / ${keys.length} fait${d>1?"s":""}`)}
function pgDecorate(){a.querySelectorAll("button.tile").forEach(b=>{const oc=b.getAttribute("onclick")||"";let m;
 if(m=oc.match(/^go\('(\w+)'/)){const e=PG[m[1]];if(e)pgBadge(b,`✅ Meilleur : ${pgF(e.best)} / 20 · ${e.t} fois`)}
 else if(m=oc.match(/^subj\('([^']+)'\)/)){if(M[m[1]])pgGroup(b,M[m[1]].filter(x=>x[1]).map(x=>x[1]))}
 else if(m=oc.match(/^om\('([^']+)','([^']+)'\)/)){if(AN[m[1]]&&AN[m[1]][m[2]])pgGroup(b,AN[m[1]][m[2]].map(x=>x[1]))}
 else if(m=oc.match(/^oa\('([^']+)'\)/)){if(AN[m[1]])pgGroup(b,Object.values(AN[m[1]]).flat().map(x=>x[1]))}})}
function pgCard(armed){const all=pgAll(),done=all.filter(k=>PG[k]),n=done.length;
 const moy=n?done.reduce((t,k)=>t+PG[k].best,0)/n:0;
 return `<div class="card pgc"><div class="sec">📈 Ma progression</div>`+(n?`<div>${n} / ${all.length} sujets terminés</div><div class="bar"><i style="width:${n/all.length*100}%"></i></div><div>Moyenne de tes meilleurs scores : <b>${pgF(moy)} / 20</b></div>`:`<div>Aucun sujet terminé pour l'instant. Va jusqu'au score d'un sujet pour le voir ici.</div>`)+
 `<div class="sub" style="margin:8px 0 0">Enregistré sur cet appareil uniquement.</div>`+(n?`<p style="margin-bottom:0"><button class="b g" id="pgr">${armed?"Confirmer : tout effacer":"Effacer ma progression"}</button></p>`:"")+`</div>`}

["subj","oy","oa","om"].forEach(f=>{const o=window[f];window[f]=function(...r){o(...r);pgDecorate()}});
const _menu=menu;menu=function(){const armed=pgArm;pgArm=false;_menu();pgDecorate();a.insertAdjacentHTML("beforeend",pgCard(armed));const r=document.getElementById("pgr");if(r)r.onclick=()=>{if(armed){PG={};pgSave()}else pgArm=true;menu()}};
