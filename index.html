 les 3 qui caractérisent le syndrome dysentérique.", ["Des douleurs abdominales intenses avec sensations de pesanteur", "Des épreintes", "Des ténesmes", "Une diarrhée faite de glaire muco-sanguinolente", "Une diarrhée afécale avec en moyenne plus de 10 selles par jour", "Des vomissements suivis d’une déshydratation"], "BCD", "Épreintes, ténesmes, glaires et sang.", null, false], ["Le plus souvent, c’est la combinaison de divers symptômes qui rend la situation du malade en situation palliative insupportable.", ["Vrai", "Faux"], "A", "C'est l'accumulation des symptômes qui épuise le malade.", null, true], ["En soins palliatifs, l’absence des autres symptômes rend impossible le soulagement du symptôme apparent.", ["Vrai", "Faux"], "B", "On peut soulager un symptôme isolé.", null, true], ["L’anxiété est un état de désarroi psychique ressenti en face d’une situation, et s’accompagnant d’un sentiment d’insécurité.", ["Vrai", "Faux"], "A", "C'est la définition de l'anxiété.", null, true], ["En médecine palliative, la sédation est l’intention de soulager d’une souffrance réfractaire sans accord du patient ou à sa demande.", ["Vrai", "Faux"], "B", "La sédation se fait avec l'accord du patient ou à sa demande. À vérifier.", null, true], ["En médecine palliative, la mort peut survenir mais n’est pas recherchée.", ["Vrai", "Faux"], "A", "On soulage sans chercher à hâter la mort.", null, true], ["L’euthanasie est pénalisée dans les pays francophones dont la Côte d’Ivoire.", ["Vrai", "Faux"], "A", "L'euthanasie est interdite en Côte d'Ivoire.", null, true], ["En soins palliatifs, l’euthanasie a pour intention le refus de mettre fin à la vie du patient à sa demande ou à la demande d’un tiers.", ["Vrai", "Faux"], "B", "L'euthanasie, c'est mettre fin à la vie.", null, true], ["En soins palliatifs, la sédation et l’euthanasie ont pour finalité commune de mettre un terme à une situation jugée insupportable par le patient.", ["Vrai", "Faux"], "A", "Même finalité, mais intentions opposé angineuse intolérable d’irradiation multiple insensible à la nitroglycérine sublinguale.", ["Vrai", "Faux"], "A", "Douleur prolongée, non soulagée par la trinitrine.", null, true], ["L’énurésie est une miction incontrôlée qui survient au cours du sommeil.", ["Vrai", "Faux"], "A", "Énurésie : miction involontaire nocturne.", null, true], ["La chylurie est la présence de lymphe dans les urines donnant un aspect laiteux lié à une affection parasitaire ou consécutive à une intervention chirurgicale.", ["Vrai", "Faux"], "A", "Chylurie : urines laiteuses (filariose, chirurgie).", null, true], ["Le liquide céphalo-rachidien a pour rôle d’assurer la protection mécanique du cerveau et de la moelle épinière.", ["Vrai", "Faux"], "A", "Le LCR amortit et protège le névraxe.", null, true], ["Le liquide céphalo-rachidien a pour rôle d’assurer le maintien de l’homéostasie cérébrale.", ["Vrai", "Faux"], "A", "Il participe aussi à l'homéostasie cérébrale.", null, true], ["Le solde hydrique est la somme des entrées et des sorties lors d’une hydratation vasculaire.", ["Vrai", "Faux"], "B", "Solde = entrées − sorties.", null, true], ["Le diagnostic de la lipothymie se fait par constat d’une perte de connaissance brève et spontanée suivie de convulsions.", ["Vrai", "Faux"], "B", "Lipothymie : malaise sans perte de connaissance.", null, true]]};
D.agp={tf:0,Q:[["Nouveau-né GG, sexe masculin, âgé de 5 jours, vit avec sa mère à Grand Yapo. La mère fait les soins du cordon avec une décoction de plante traditionnelle. L'examen somatique est normal. La réalité personnelle de GG comporte :", ["4 données de dépendance", "5 données de dépendance", "3 données de dépendance", "2 données de dépendance"], "D", "Décompte selon la convention du cours ; seul le soin du cordon est un risque net. À vérifier.", null, false], ["L'échographie du premier trimestre de la grossesse vise les objectifs suivants, sauf un. Cochez l'intrus.", ["Confirmer la grossesse", "Estimer le risque de trisomie", "Apprécier l'activité cardiaque de l'embryon", "Rechercher des malformations"], "D", "La recherche des malformations se fait surtout au 2e trimestre. À vérifier.", null, false], ["Les signes suivants sont ceux du kwashiorkor sauf un. Lequel ?", ["Enfant grognon", "Ulcération et desquamation", "Alopécie", "Bouffissure du visage"], "C", "L'alopécie évoque plutôt le marasme ; le kwashiorkor décolore les cheveux. À vérifier.", null, false], ["Durant la prise en charge de l’enfant malnutri, je surveille tous les paramètres suivants sauf un. Cocher ce paramètre.", ["Le retour de l'appétit", "La prise de poids", "La guérison des lésions", "La régression des œdèmes"], "C", "On suit l'appétit, le poids et les œdèmes. À vérifier.", null, false], ["Les cellules qui produisent le lait maternel sont appelées :", ["Cellules souches", "Cellules épidermiques", "Cellules épithéliales", "Cellules myoépithéliales"], "C", "Les cellules épithéliales des alvéoles sécrètent le lait ; les myoépithéliales l'éjectent.", null, false], ["BH est âgé de 2 ans et pèse 12 kg. Il est correctement nourri. Sa surface corporelle est estimée à :", ["0,2 m²", "0,4 m²", "0,5 m²", "0,6 m²"], "C", "SC = (4P + 7) / (P + 90) = 55 / 102 ≈ 0,5 m².", null, false], ["L'infection bactérienne précoce du nouveau-né survient entre :", ["0 et 7 jours", "7 et 8 jours", "8 et 16 jours", "16 et 28 jours"], "A", "IBN précoce : première semaine de vie.", null, false], ["Vous collaborez à la réalisation des examens suivants en cas de fièvre aiguë, sauf un, lequel ?", ["Hémoculture", "ECBU", "Analyse du LCR", "Sérodiagnostic de Widal et Félix"], "D", "Le Widal est peu fiable devant une fièvre aiguë. À vérifier.", null, false], ["Un enfant qui fait de la fièvre avec une bonne tolérance présente :", ["Une conscience altérée", "Des marbrures", "Un faciès vultueux", "Un teint grisâtre"], "C", "Faciès rouge et chaud : fièvre bien tolérée. Les autres sont des signes de mauvaise tolérance.", null, false], ["Une femme rhésus négatif accouche d’un enfant rhésus positif. Elle n’a pas eu le sérum anti-D. Dans une telle situation, le nouveau-né :", ["Doit téter les seins comme les autres enfants", "Ne doit pas téter les seins comme les autres enfants", "Doit être nourri au biberon", "Doit recevoir le sérum antitétanique en sous-cutané"], "A", "L'incompatibilité rhésus n'empêche pas l'allaitement.", null, false], ["Les facteurs de risque de survenue des convulsions, liés à l’enfant, sont les suivants, sauf un, lequel ?", ["Faible poids de naissance", "Céphalhématome", "Traumatisme crânien", "Malnutrition"], "B", "Le céphalhématome est bénin et sans risque cérébral. À vérifier.", null, false], ["Les rôles de collaboration dans la prise en charge des convulsions sont :", ["Administrer le diazépam", "Récupérer les résultats de laboratoire", "Prendre une voie veineuse", "Aider la mère à allaiter"], "ABC", "Ce sont des actes sur prescription. Aider à allaiter est un rôle propre.", null, false], ["ML est âgé de 36 mois, sa mère l’amène aux urgences pour une diarrhée glaireuse. Le germe probable à l’origine de cette diarrhée est :", ["Shigelles", "Escherichia coli", "Vibrion cholérique", "Rotavirus"], "A", "Diarrhée glaireuse (dysentérique) : Shigella.", null, false], ["La mère de JK n'a pas respecté la prescription médicale. 4 jours plus tard, JK pèse 8 kg, a les yeux enfoncés, la bouche sèche et des signes évidents de déshydratation. Quelle quantité de SRO faut-il administrer ?", ["500 ml", "400 ml", "600 ml", "700 ml"], "C", "Plan B : 75 ml/kg × 8 kg = 600 ml en 4 h.", null, false], ["La diarrhée aiguë concerne l’émission d’au moins 3 selles liquides par 24 heures depuis moins de :", ["21 jours", "14 jours", "10 jours", "8 jours"], "B", "Diarrhée aiguë : moins de 14 jours.", null, false], ["Le plan de traitement des signes sévères de déshydratation est le :", ["Plan A", "Plan B", "Plan C", "Plan D"], "C", "Déshydratation sévère : plan C.", null, false], ["DG est incapable de nouer les lacets de ses tennis, mais il s'habille seul et raconte de petites histoires. Je conclus que DG est âgé de :", ["2 ans", "3 ans", "4 ans", "5 ans"], "C", "S'habille seul, raconte des histoires, ne noue pas encore ses lacets : environ 4 ans. À vérifier.", null, false], ["Les propositions suivantes concernent les signes d’un enfant souffrant de marasme. Cochez la proposition qui est retrouvée au stade de début de cette maladie.", ["Fonte graisseuse et musculaire", "Retard pondéral inférieur à 60 % du poids idéal théorique", "Affamé et porte le doigt à la bouche", "Alopécie, le reste des cheveux normaux non décolorés"], "C", "Au début, l'enfant a faim ; la fonte vient ensuite.", null, false], ["Les propositions suivantes sont relatives à la bonne pratique de la réanimation du nouveau-né en salle de naissance sauf une. Cocher cette proposition.", ["Essuyer l'enfant", "Vérifier la respiration", "Porter un bonnet", "Pincer le mamelon"], "D", "On ne pince pas le mamelon en réanimation néonatale.", null, false], ["Les séquelles neurologiques et neurosensorielles au cours du paludisme sont les suivantes sauf une, laquelle ?", ["Paralysie", "Troubles du tonus", "Myosite", "Hypoacousie"], "C", "La myosite n'est pas une séquelle neurologique.", null, false], ["Le paludisme grave est causé par l’espèce plasmodiale suivante :", ["Vivax", "Ovale", "Knowlesi", "Falciparum"], "D", "Les formes graves sont dues à P. falciparum.", null, false], ["Les facteurs de mauvais pronostic au cours de la méningite purulente sont les suivants, sauf un, lequel ?", ["Âge de moins de 5 ans", "Virulence du germe", "Malnutrition", "Retard de diagnostic et de prise en charge"], "A", "Le risque majeur concerne surtout le nourrisson de moins d'un an. À vérifier.", null, false], ["Les principaux virus responsables des infections respiratoires aiguës sont les suivants, sauf un, lequel ?", ["Virus parainfluenzae", "Herpès simplex virus", "Rhinovirus", "Virus respiratoire syncytial"], "B", "L'herpès simplex n'est pas un virus respiratoire habituel.", null, false], ["Ces affirmations concernant la bronchiolite sont justes sauf une. Laquelle ?", ["Causée par le virus respiratoire syncytial", "Respiration sifflante", "Fièvre et rhume", "Plus fréquente après 2 ans"], "D", "La bronchiolite touche surtout les moins de 2 ans.", null, false], ["Laisser l'enfant avec sa mère 10 heures par jour est l'une des conditions de l'initiative Hôpitaux amis des bébés (IHAB).", ["Vrai", "Faux"], "B", "IHAB : cohabitation mère-enfant 24 h sur 24.", null, true], ["L'électrophorèse de l'hémoglobine fait partie du bilan prénatal recommandé.", ["Vrai", "Faux"], "A", "Recommandé pour dépister la drépanocytose. À vérifier.", null, true], ["Le nourrisson allaité qui émet 3 à 4 selles par jour souffre d'une diarrhée aiguë.", ["Vrai", "Faux"], "B", "Des selles fréquentes sont normales chez l'enfant allaité.", null, true], ["La lèvre inférieure du bébé éversée et l'aréole peu visible en haut sont des critères de bon positionnement au sein.", ["Vrai", "Faux"], "B", "L'aréole doit être plus visible en haut qu'en bas.", null, true], ["Le surfactant est un film tensioactif sécrété par les pneumocytes I des poumons.", ["Vrai", "Faux"], "B", "Le surfactant vient des pneumocytes II.", null, true], ["L'entérocolite est un problème lié à la prématurité.", ["Vrai", "Faux"], "A", "L'entérocolite ulcéronécrosante touche surtout le prématuré.", null, true], ["Le manque de soutien psychologique de la mère est un facteur de déclin de l'allaitement exclusif.", ["Vrai", "Faux"], "A", "Le soutien psychologique maintient l'allaitement.", null, true], ["L'enveloppement humide est un rôle propre de l'agent de santé dans la prise en charge de la fièvre chez l'enfant.", ["Vrai", "Faux"], "A", "Les moyens physiques relèvent du rôle propre. À vérifier.", null, true], ["Des crises convulsives subintrantes sans reprise de la conscience intercritique réalisent un état de mal convulsif.", ["Vrai", "Faux"], "A", "C'est la définition de l'état de mal convulsif.", null, true], ["L'hyperparasitémie supérieure à 4 % chez le sujet immun est un critère clinique de gravité du paludisme grave.", ["Vrai", "Faux"], "B", "C'est un critère biologique, pas clinique.", null, true], ["JL a 4 ans, il présente seulement une fièvre et 2 vomissements ce jour. Le TDR paludisme réalisé est positif. Le traitement à administrer est l’artéméther injectable.", ["Vrai", "Faux"], "B", "Paludisme simple : ACT par voie orale.", null, true], ["Le stress et le manque d’affection favorisent les vomissements du nourrisson.", ["Vrai", "Faux"], "A", "Les facteurs psychoaffectifs peuvent causer des vomissements.", null, true], ["Le temps de recoloration cutanée supérieur à 3 secondes est un signe de bonne tolérance de la fièvre.", ["Vrai", "Faux"], "B", "TRC > 3 s : mauvaise tolérance.", null, true], ["Les téguments chauds et érythrosiques sont des signes de bonne tolérance de la fièvre.", ["Vrai", "Faux"], "A", "Peau chaude et rouge : fièvre bien tolérée.", null, true], ["Le syndrome extrapyramidal qui survient chez l’enfant après administration de l’antiémétisant se traite avec du diazépam.", ["Vrai", "Faux"], "B", "On arrête le produit ; l'antidote est un anticholinergique. À vérifier.", null, true], ["Le nourrisson présentant une diarrhée aiguë sans signe de déshydratation boit avec avidité.", ["Vrai", "Faux D.d6s={tf:0,Q:[["Le superviseur ayant le style autocratique cherche à tout comprendre.", ["Vrai", "Faux"], "B", "L'autocrate décide seul, sans chercher à comprendre.", null, true], ["L’intervention en approche épidémiologique repose sur le contrôle, l’éradication, l’élimination et la maîtrise de la maladie.", ["Vrai", "Faux"], "A", "Contrôle, élimination, éradication, maîtrise.", null, true], ["Le processus d’évacuation des ordures ménagères comprend le stockage et le ramassage.", ["Vrai", "Faux"], "A", "Stockage (pré-collecte) puis ramassage, transport, traitement.", null, true], ["Le taux de létalité permet d’évaluer la qualité de la prise en charge des malades.", ["Vrai", "Faux"], "A", "Beaucoup de décès parmi les malades = prise en charge à revoir.", null, true], ["La participation communautaire a été prônée en 1985 à Bamako pour garantir la mise en œuvre et la pérennisation d’un système de financement communautaire.", ["Vrai", "Faux"], "B", "L'Initiative de Bamako date de 1987.", null, true], ["L’absence d’humidité dans le logement est un critère de salubrité de l’habitat relatif aux besoins physiologiques.", ["Vrai", "Faux"], "A", "Un logement sec répond aux besoins physiologiques. À vérifier.", null, true], ["Le bassin de desserte correspond à une zone située dans un rayon de 15 km autour d’un centre de santé.", ["Vrai", "Faux"], "B", "Définition qui dépend du cours (5 ou 15 km). À vérifier.", null, true], ["Le district est l’unité sanitaire décentralisée regroupant tous les services sanitaires publics tant en milieu urbain que rural.", ["Vrai", "Faux"], "A", "Le district couvre public urbain et rural.", null, true], ["Les doses de vaccins perdues pour que la vaccination ait lieu sont considérées comme des doses sacrifiées.", ["Vrai", "Faux"], "A", "Ouvrir un flacon pour peu d'enfants « sacrifie » des doses.", null, true], ["Plus le taux de perte est élevé, moins le facteur de perte est élevé.", ["Vrai", "Faux"], "B", "FP = 100 / (100 − taux de perte) : il augmente avec le taux.", null, true], ["Dans les cas de poliomyélite à virus de type sauvage, l’excrétion virale dans les selles augmente au-delà de deux semaines après le début de la paralysie.", ["Vrai", "Faux"], "B", "L'excrétion est maximale les deux premières semaines, puis diminue.", null, true], ["Le sujet d’intérêt en épidémiologie est le malade.", ["Vrai", "Faux"], "B", "L'épidémiologie étudie la population, pas le seul malade.", null, true], ["En matière de vaccination, l’intervalle minimum existe.", ["Vrai", "Faux"], "A", "Il faut au moins 4 semaines entre deux doses d'une série.", null, true], ["Les centres antituberculeux sont situés au niveau périphérique du versant administratif du PNLT.", ["Vrai", "Faux"], "B", "Les centres antituberculeux ne sont pas au niveau périphérique. À vérifier.", null, true], ["Le seuil d’alerte est le niveau à partir duquel la riposte doit être déclenchée face à une menace d’épidémie.", ["Vrai", "Faux"], "B", "Le seuil d'alerte lance l'investigation ; le seuil épidémique, la riposte.", null, true], ["L’accessibilité aux soins consiste à mettre les soins de santé à proximité des populations et à un prix non exorbitant.", ["Vrai", "Faux"], "A", "Accessibilité géographique et financière.", null, true], ["Le non-respect de la politique du flacon entamé est un facteur évitable de perte de vaccins.", ["Vrai", "Faux"], "A", "Respecter la politique des flacons entamés réduit les pertes.", null, true], ["En Côte d’Ivoire, la politique des SSP comprend deux composantes préventives et trois composantes curatives.", ["Vrai", "Faux"], "B", "Énoncé non conforme aux composantes du cours. À vérifier.", null, true], ["On peut administrer le VPI à tous les enfants ayant un âge compris entre 0 et 23 mois sans exception.", ["Vrai", "Faux"], "B", "Il existe des contre-indications : pas « sans exception ».", null, true], ["Parmi les éléments suivants, identifier ceux qui constituent des différentes catastrophes naturelles :", ["La guerre", "Les cy let a;
let P,i,s,W,cur,lock;
const sh=x=>{for(let j=x.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[x[j],x[r]]=[x[r],x[j]]}return x};
function fmt(x){const names={TBN:"taux brut de natalité (TBN)",TBM:"taux brut de mortalité (TBM)",TAA:"taux d'accroissement annuel (TAA)",TGF:"taux général de fécondité (TGF)",TAN:"taux d'accroissement naturel (TAN)",TMNP:"taux de mortalité néonatale précoce (TMNP)",TMNT:"taux de mortalité néonatale tardive (TMNT)",TMPN:"taux de mortalité post-néonatale (TMPN)",TMI:"taux de mortalité infantile (TMI)",TMM:"taux de mortalité maternelle (TMM)",FP:"facteur de pertes (FP)",TAG:"taux d'abandon global (TAG)",TAS:"taux d'abandon spécifique (TAS)",TCV:"taux de couverture vaccinale (TCV)",TP:"taux de pertes (TP)",TU:"taux d'utilisation (TU)"};for(const [k,v] of Object.entries(names))x=x.replace(new RegExp('\\b'+k+'\\b','g'),v);return x.replace(/([^<>{}]+?)\s\/\s([^<>{}]+?)(?=(?:\s×|\s=|[.,;]|$))/g,(m,n,d)=>`<span class="frac"><span>${n.trim()}</span><span>${d.trim()}</span></span>`)}
function home(){a.innerHTML=`<div class="hero"><div class="tag">🧮 Santé publique</div><h1>Quiz formules</h1><div>${Q.length} questions : Vrai/Faux, formules à compléter et petits calculs, tirées au hasard.</div></div><button class="o" onclick="window.__formula_go(10)">10 questions</button><button class="o" onclick="window.__formula_go(20)">20 questions</button><button class="o" onclick="window.__formula_go(${Q.length})">Toutes les questions (${Q.length})</button>`}
function go(n){P=sh(Q.slice()).slice(0,n);i=0;s=0;W=[];show()}
function show(){const q=P[i];lock=false;
 cur=q[0]=="v"?{o:["Vrai","Faux"],ok:q[2]?0:1}:(()=>{const o=q[2].map((t,k)=>({t,k}));sh(o);return{o:o.map(x=>x.t),ok:o.findIndex(x=>x.k==0)}})();
 a.innerHTML=`<div class="sub">Question ${i+1} / ${P.length}</div><div class="bar"><i style="width:${i/P.length*100}%"></i></div><div class="card"><b>${fmt(q[1])}</b>${cur.o.map((t,k)=>`<button class="o" onclick="window.__formula_pick(${k})">${t}</button>`).join("")}<div id="x"></div></div><button class="b g" onclick="window.__formula_home()">Quitter</button>`}
function pick(k){if(lock)return;lock=true;const q=P[i],ok=k==cur.ok;if(ok)s++;else W.push([q,cur.o[k],cur.o[cur.ok]]);
 a.querySelectorAll(".o").forEach((b,j)=>{if(j==cur.ok)b.classList.add("ok");else if(j==k)b.classList.add("ko")});
 document.getElementById("x").innerHTML=`<div class="ex"><b>${ok?"✅ Juste":"❌ Faux"}</b><br><span class="f">Formule :</span> ${fmt(q[3])}</div><p><button class="b" onclick="window.__formula_nx()">${i==P.length-1?"Voir mon score":"Suivante"}</button></p>`}
function nx(){i++;i<P.length?show():end()}
function end(){a.innerHTML=`<div class="card" style="text-align:center"><div>Ton score</div><div class="big">${s} / ${P.length}</div><p>${Math.round(s/P.length*100)} %</p>${W.length?`<button class="b" onclick="window.__formula_rev()">Revoir mes erreurs (${W.length})</button>`:""}<button class="b" onclick="window.__formula_go(P.length)">Recommencer</button><button class="b g" onclick="window.__formula_home()">Menu</button></div>`}
function rev(){a.innerHTML=`<div class="sub">Mes erreurs : ${W.length}</div>`+W.map(([q,u,c])=>`<div class="card"><b>${fmt(q[1])}</b><div class="o ko">❌ ${u}</div><div class="o ok">✅ ${c}</div><div class="ex"><span class="f">Formule :</span> ${fmt(q[3])}</div></div>`).join("")+`<button class="b" onclick="window.__formula_end()">← Retour au score</button>`}

window.__formula_go=go;window.__formula_pick=pick;window.__formula_nx=nx;window.__formula_rev=rev;window.__formula_end=end;window.__formula_home=home;window.openFormulaQuiz=function(){a=document.getElementById("a");home()};

})();
</script></body></html>
